# SonarQube - TrackIt Express Backend
# 1) npm run lint:sonar && npm run test:coverage   2) npm run sonar -- -Dsonar.host.url=http://localhost:9000 -Dsonar.token=TU_TOKEN
sonar.projectKey=trackit-express-backend
sonar.projectName=TrackIt Express - Backend
sonar.projectVersion=2.4.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,logs/**,uploads/**
sonar.test.inclusions=tests/**/*.test.ts
# Por defecto SonarQube omite toda carpeta llamada "external": aquí están los adaptadores de Nequi,
# correo, Cloudinary y OpenStreetMap, así que se analizan explícitamente
sonar.javascript.exclusions=**/node_modules/**,**/dist/**

# Cobertura generada por Jest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# El arranque del servidor y el CLI de base de datos no se ejecutan en pruebas
sonar.coverage.exclusions=src/infrastructure/http/server.ts,src/infrastructure/database/cli.ts,src/**/*.d.ts
# La especificación OpenAPI es un documento (datos), no lógica repetida
sonar.cpd.exclusions=src/infrastructure/http/docs/openapi.ts

# Hallazgos de ESLint (incluye las reglas de SonarJS) importados en el análisis
sonar.eslint.reportPaths=reports/eslint.json

sonar.typescript.tsconfigPaths=tsconfig.json
