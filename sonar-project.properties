# SonarQube - TrackIt Express Backend
# Ejecutar: npm run test:coverage && npm run sonar  (ver README, sección "Calidad con SonarQube")
sonar.projectKey=trackit-express-backend
sonar.projectName=TrackIt Express - Backend
sonar.projectVersion=2.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,logs/**,uploads/**
sonar.test.inclusions=tests/**/*.test.ts

# Cobertura generada por Jest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# El arranque del proceso no se ejecuta en pruebas
sonar.coverage.exclusions=src/infrastructure/http/server.ts,src/**/*.d.ts

sonar.typescript.tsconfigPaths=tsconfig.json
