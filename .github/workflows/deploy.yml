# Despliegue del backend en AWS (EC2) cuando el CI de main pasa, o a mano desde la pestaña Actions.
# 1. Construye la imagen trackit-api y la publica en GitHub Container Registry (ghcr.io).
# 2. Copia al servidor docker-compose.yml, Caddyfile y respaldo.sh y actualiza db + api.
# Requiere en Settings → Secrets and variables → Actions:
#   variable EC2_HOST (IP elástica o dominio), variable EC2_USUARIO (por defecto ubuntu)
#   secreto EC2_LLAVE_SSH (contenido completo del archivo .pem)
name: Desplegar backend

on:
  workflow_run:
    workflows: [CI backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: desplegar-produccion-api
  cancel-in-progress: false

jobs:
  imagen:
    name: Publicar imagen
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      etiqueta: ${{ steps.datos.outputs.etiqueta }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Nombre y etiqueta de la imagen
        id: datos
        run: |
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trackit-api" >> "$GITHUB_OUTPUT"
          echo "etiqueta=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.datos.outputs.imagen }}:latest
            ${{ steps.datos.outputs.imagen }}:${{ steps.datos.outputs.etiqueta }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  servidor:
    name: Actualizar el servidor
    needs: imagen
    if: ${{ vars.EC2_HOST != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ vars.EC2_HOST }}
      USUARIO: ${{ vars.EC2_USUARIO || 'ubuntu' }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Preparar la llave SSH
        env:
          LLAVE: ${{ secrets.EC2_LLAVE_SSH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LLAVE" > ~/.ssh/trackit.pem
          chmod 600 ~/.ssh/trackit.pem
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts

      - name: Copiar la configuración del despliegue
        run: |
          scp -i ~/.ssh/trackit.pem deploy/aws/docker-compose.yml deploy/aws/Caddyfile deploy/aws/respaldo.sh \
            "$USUARIO@$HOST:/opt/trackit/"

      - name: Actualizar la base y la API
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # El token va por la entrada estándar (no queda en la línea de comandos del servidor)
          {
          printf 'TOKEN=%q\nACTOR=%q\n' "$TOKEN" "$ACTOR"
          cat <<'REMOTO'
          set -euo pipefail
          cd /opt/trackit
          chmod +x respaldo.sh
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker compose pull api
          docker compose up -d --no-deps db api
          docker logout ghcr.io
          docker image prune -f
          # Espera a que la API quede saludable (aplica las migraciones al iniciar)
          for i in $(seq 1 30); do
            estado="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)")"
            [ "$estado" = healthy ] && { echo "API saludable"; exit 0; }
            sleep 5
          done
          docker compose logs --tail 80 api
          echo "La API no quedó saludable" >&2
          exit 1
          REMOTO
          } | ssh -i ~/.ssh/trackit.pem "$USUARIO@$HOST" 'bash -s'
